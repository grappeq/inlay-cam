[workspace]
resolver = "2"
members = ["crates/inlay-core", "crates/inlay-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = 3
lto = true

# Geometry libraries are too slow unoptimised for the tests that cut whole shapes.
[profile.dev.package."*"]
opt-level = 2

# So are this project's own toolpath and simulation code.
[profile.dev.package.inlay-core]
opt-level = 2
